<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login - ODA Bultum University</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding-top: 80px;
        }

        .login-box {
            background: white;
            width: 320px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            background: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Teacher Login</h2>
        <h3>ODA Bultum University</h3>

        <form action="teacher-login" method="post">

            <input type="email" name="email"
                   placeholder="Email Address" required>

            <input type="password" name="password"
                   placeholder="Password" required>

            <br>

            <button type="submit">Login</button>

        </form>
    </div>

</body>
</html>
