<!DOCTYPE html>
<html>
<head>
    <title>Teacher Courses - ODA Bultum University</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            text-align: center;
        }

        header {
            background: #003366;
            color: white;
            padding: 25px;
        }

        .container {
            background: white;
            width: 80%;
            max-width: 450px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            background: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ODA BULTUM UNIVERSITY</h1>
        <h2>Teacher Course Management</h2>
    </header>

    <div class="container">

        <h2>Add New Course</h2>

        <form action="add-course" method="post">

            <input type="text" name="course_name"
                   placeholder="Course Name" required>

            <input type="text" name="course_code"
                   placeholder="Course Code" required>

            <textarea name="description"
                      placeholder="Course Description"
                      required></textarea>

            <br>

            <button type="submit">Add Course</button>

        </form>

        <a href="teacher-dashboard.html">
            Back to Teacher Dashboard
        </a>

    </div>

</body>
</html>
